<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Studio</title>
<style>
body{margin:0;font-family:system-ui;background:#f5f7fb;color:#0f2040}
.header{display:flex;justify-content:space-between;align-items:center;padding:18px;background:white}
.card{margin:12px;border-radius:22px;padding:20px}
.blue{background:#1a6cff;color:white}
.orange{background:#ff9a2a;color:white}
.btn{background:white;border:0;border-radius:30px;padding:12px 22px;font-weight:bold}
video, img, canvas{object-fit:cover !important; width:100%; height:100%}
#preview{width:100%;aspect-ratio:9/16;background:black;border-radius:16px;overflow:hidden}
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px}
.pay{background:white;border-radius:14px;padding:12px;text-align:center;border:1px solid #e5e8f0}
</style>
</head>
<body>
<div class="header"><h2>Create Studio</h2><div>🔔 K</div></div>

<div class="card" style="background:linear-gradient(90deg,#dbe9ff,#fff2d6)">
<b>Hello, Kelebogile!</b><br>Design & share in minutes ✨
</div>

<div class="card blue">
<h3>📄 Create Flyer</h3>
<p>Design posters, events, promotions</p>
<button class="btn" onclick="flyerMode()">Create Flyer →</button>
</div>

<div class="card orange">
<h3>▶️ Create TikTok Video / Facebook Reels</h3>
<p>9:16 vertical • 2-4 photos upload</p>
<input type="file" id="photos" multiple accept="image/*">
<button class="btn" style="color:#ff9a2a" onclick="makeVideo()">Create Video →</button>
</div>

<div id="preview"><canvas id="canvas" width="1080" height="1920"></canvas></div>
<video id="result" controls style="display:none"></video>

<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');

function drawCover(img){
 const cr=canvas.width/canvas.height, ir=img.width/img.height;
 let w,h,x,y;
 if(ir>cr){h=canvas.height;w=h*ir;x=(canvas.width-w)/2;y=0}
 else{w=canvas.width;h=w/ir;x=0;y=(canvas.height-h)/2}
 ctx.drawImage(img,x,y,w,h);
}
async function makeVideo(){
 const files=document.getElementById('photos').files;
 if(files.length<2||files.length>4)return alert('Upload 2-4 photos');
 const imgs=await Promise.all([...files].map(f=>new Promise(r=>{let i=new Image();i.onload=()=>r(i);i.src=URL.createObjectURL(f)})));
 let idx=0;
 const stream=canvas.captureStream(30);
 const rec=new MediaRecorder(stream,{mimeType:'video/webm'});
 const chunks=[];
 rec.ondataavailable=e=>chunks.push(e.data);
 rec.onstop=()=>{const blob=new Blob(chunks,{type:'video/webm'});document.getElementById('result').src=URL.createObjectURL(blob);document.getElementById('result').style.display='block'};
 rec.start();
 (function loop(){
  if(idx>=imgs.length){rec.stop();return}
  drawCover(imgs[idx]);
  setTimeout(()=>{idx++;loop()},1500);
 })();
}
</script>
</body>
  </html>
