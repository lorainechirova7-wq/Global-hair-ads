*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, -apple-system, sans-serif}
body{background:#f5f7fb;color:#0f2040;padding-bottom:80px}
.header{display:flex;justify-content:space-between;align-items:center;padding:16px;background:white;position:sticky;top:0;z-index:10}

.orange .btn{color:#ff9a2a}
label{font-weight:700;display:block;margin:10px 0 6px}
input[type="text"], input[type="file"]{width:100%;padding:12px;border-radius:12px;border:1px solid #dbe0eb}
#previewWrap{margin:14px;background:black;border-radius:18px;overflow:hidden;aspect-ratio:9/16;position:relative}
#canvas{width:100%;height:100%;display:block;object-fit:cover}
#resultVideo{width:100%;border-radius:18px;margin:14px;display:none;background:black;aspect-ratio:9/16;object-fit:cover}
.pay-title{margin:20px 14px 6px;font-size:22px;font-weight:800}
.pay-sub{margin:0 14px 10px;color:#666}
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 14px}
.pay{background:white;border-radius:14px;padding:14px;text-align:center;border:1px solid #e5e8f0;font-weight:700;font-size:14px}
.pay span{display:block;font-size:11px;color:#666;margin-top:2px;font-weight:400}
.small{font-size:12px;color:rgba(255,255,255,0.85);margin:6px 0}
</style>
</head>
