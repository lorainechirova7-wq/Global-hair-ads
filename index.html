<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Global Ads Studio</title>
<link rel="manifest" href="manifest.json">
   <style>
body{font-family:system-ui;max-width:430px;margin:auto;padding:16px;background:#fffaf7}
.card{border:1px solid #eee;border-radius:16px;padding:12px;background:#fff;margin-top:12px}
button{padding:12px 14px;border-radius:12px;border:0;font-weight:700}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-top:8px;box-sizing:border-box}
canvas{width:100%;border-radius:12px;margin-top:10px;background:#f3f3f3}
</style></head><body>
<h2 style="margin:0">Global Ads Studio</h2>

<div style="display:flex;gap:8px;margin-top:10px">
<button id="b1" onclick="mode='flyer';set()" style="flex:1;background:#000;color:#fff">Flyer 1:1</button>
<button id="b2" onclick="mode='video';set()" style="flex:1;background:#eee">Reels 9:16</button>
</div>

<div class="card">
<input type="file" id="f" multiple accept="image/*">
<div id="info" style="font-size:12px;color:gray;margin-top:4px">Add 2-4 hair photos</div>
<input id="cap" placeholder="Caption e.g. Knotless Braids P250">
<input id="ph" placeholder="WhatsApp to show on flyer">
<button onclick="make()" id="mk" style="width:100%;margin-top:10px;background:#111;color:#fff">Make & Download</button>
<canvas id="c" width="1080" height="1080"></canvas>
</div>

<div class="card">
<h3 style="margin:0">Unlock HD - P99</h3><p style="font-size:12px;color:gray">Pay P99, WhatsApp POP, I unlock your phone. 6 secure methods.</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
<button onclick="pay('Payoneer')" style="background:#f5f5f5">Payoneer</button>
<button onclick="pay('Skrill')" style="background:#f5f5f5">Skrill</button>
<button onclick="pay('Airtm')" style="background:#f5f5f5">Airtm</button>
<button onclick="pay('Orange')" style="background:#f5f5f5">Orange Money</button>
<button onclick="pay('MyZaka')" style="background:#f5f5f5">MyZaka</button>
<button onclick="pay('Binance')" style="background:#f5f5f5">Binance</button>
</div>
<button onclick="unlock()" style="width:100%;margin-top:10px;background:#fff;border:1px dashed #999">I have paid - Enter code</button>
</div>

<script>
let mode='flyer', imgs=[], paid=!!localStorage.paid_global;
const C=document.getElementById('c'), X=C.getContext('2d');
function set(){
 C.width=1080; C.height=mode=='flyer'?1080:1920;
 document.getElementById('b1').style.background=mode=='flyer'?'#000':'#eee';
 document.getElementById('b1').style.color=mode=='flyer'?'#fff':'#000';
 document.getElementById('b2').style.background=mode=='video'?'#f97316':'#eee';
 document.getElementById('b2').style.color=mode=='video'?'#fff':'#000';
 document.getElementById('mk').innerText=mode=='flyer'?'Download Flyer':'Download Reels Video';
}
document.getElementById('f').onchange=e=>{
 const fs=[...e.target.files].slice(0,4); if(fs.length<2)return alert('Need 2-4 photos');
 Promise.all(fs.map(f=>new Promise(r=>{let i=new Image(); i.onload=()=>r(i); i.src=URL.createObjectURL(f)}))).then(a=>{imgs=a; document.getElementById('info').innerText=a.length+'/4 ready';});
};
async function make(){
 if(imgs.length<2)return alert('Add 2-4 photos'); const cap=document.getElementById('cap').value, ph=document.getElementById('ph').value; if(!cap||!ph)return alert('Add caption + number');
 if(mode=='flyer'){ X.drawImage(imgs[0],0,0,1080,1080); X.fillStyle='rgba(0,0,0,.55)'; X.fillRect(0,830,1080,250); X.fillStyle='#fff'; X.font='bold 54px sans-serif'; X.fillText(cap,40,910); X.font='42px sans-serif'; X.fillText(ph,40,970); if(!paid){X.font='bold 28px sans-serif'; X.fillText('PREVIEW - Global Ads',320,80);} const a=document.createElement('a'); a.download='global-flyer.png'; a.href=C.toDataURL(); a.click();}
 else { const s=C.captureStream(30); const r=new MediaRecorder(s,{mimeType:'video/webm'}); let ch=[]; r.ondataavailable=e=>ch.push(e.data); r.onstop=()=>{let b=new Blob(ch,{type:'video/webm'}); let u=URL.createObjectURL(b); let a=document.createElement('a'); a.href=u; a.download='global-reels.webm'; a.click();}; r.start(); for(let im of imgs){ for(let i=0;i<90;i++){ const z=1+i*0.002; X.clearRect(0,0,1080,1920); X.save(); X.translate(540,960); X.scale(z,z); X.drawImage(im,-540,-960,1080,1920); X.restore(); X.fillStyle='rgba(0,0,0,.55)'; X.fillRect(0,1660,1080,260); X.fillStyle='#fff'; X.font='bold 60px sans-serif'; X.fillText(cap,40,1740); X.font='50px sans-serif'; X.fillText(ph,40,1820); if(!paid){X.font='bold 36px sans-serif'; X.fillText('PREVIEW',430,120);} await new Promise(r=>setTimeout(r,32)); } } r.stop(); }
}
function pay(m){ const id='GLOBAL-'+Date.now().toString().slice(-6); const msg=`Hi Loraine - Global Ads%0AID:${id}%0AMethod:${m}%0AMy advert number:${document.getElementById('ph').value}`; window.open('https://wa.me/26775301514?text='+msg,'_blank'); alert('WhatsApp opened. Send POP P99. Your ID: '+id); }
function unlock(){ let c=prompt('Enter code from Loraine:'); if(c==='GLOBAL2026'){localStorage.paid_global=1; paid=true; alert('Unlocked Global! Now download HD without watermark');} else alert('Wrong code - WhatsApp 75301514');}
set();
</script></body></html>
